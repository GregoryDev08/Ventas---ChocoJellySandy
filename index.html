<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Notas de Venta - Choco Jelly Sandy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div id="lockScreen" class="lock-overlay">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2>Choco Jelly Sandy</h2>
      <p>Ingresa tu PIN de seguridad para emitir notas de venta</p>
      <input type="password" inputmode="numeric" id="pinInput" class="pin-input" placeholder="••••" maxlength="10" autocomplete="off" />
      <button type="button" id="btnUnlock" class="btn-primary">Desbloquear Sistema</button>
      <div id="lockError" class="lock-error"></div>
    </div>
  </div>

  <div class="app-container">
    <section class="editor-panel">
      <div class="panel-header">
        <h1>Choco Jelly Sandy</h1>
        <div class="header-actions">
          <span id="syncStatus" class="sync-badge">Bloqueado</span>
          <button type="button" id="btnLockApp" class="btn-lock-small" title="Cerrar sesión y bloquear">🔒 Salir</button>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="inputNota">N° de Nota</label>
          <div class="nota-row">
            <input type="text" id="inputNota" value="000065" />
            <button type="button" class="btn-icon" id="btnRefreshNum" title="Sincronizar siguiente número">↻</button>
          </div>
        </div>

        <div class="form-group">
          <label for="inputFecha">Fecha</label>
          <input type="date" id="inputFecha" />
        </div>

        <div class="form-group full">
          <label for="inputCliente">Cliente</label>
          <input type="text" id="inputCliente" placeholder="Nombre y apellido del cliente" />
        </div>

        <div class="form-group full">
          <label for="inputTelefono">Teléfono Cliente</label>
          <input type="text" id="inputTelefono" placeholder="Ej. 0991234567" />
        </div>
      </div>

      <div class="section-title">
        <span>Detalle de Postres (Máx. 5 filas)</span>
        <span class="hint-text">Cant. / Descripción / P. Unit</span>
      </div>

      <div id="itemsList" class="items-list"></div>
      <button type="button" class="btn-add" id="btnAddItem">+ Agregar otro postre</button>

      <div class="form-grid">
        <div class="form-group">
          <label for="inputDescuento">Descuento</label>
          <div class="discount-box">
            <input type="number" id="inputDescuento" min="0" step="0.01" value="0" />
            <select id="selectDescuentoTipo">
              <option value="$">$</option>
              <option value="%">%</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="inputEnvio">Envío ($)</label>
          <input type="number" id="inputEnvio" min="0" step="0.01" value="0" />
        </div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="checkFirma" checked />
        <span>Incluir Firma Autorizada en la nota</span>
      </label>

      <div class="actions-stack">
        <button type="button" class="btn-primary" id="btnSavePng">Guardar en Sheets y Descargar PNG</button>
        <button type="button" class="btn-secondary" id="btnSavePdf">Guardar en Sheets y Descargar PDF</button>

        <div class="secondary-row">
          <button type="button" class="btn-ghost" id="btnOnlyPng">Solo PNG</button>
          <button type="button" class="btn-ghost" id="btnOnlyPdf">Solo PDF</button>
          <button type="button" class="btn-ghost" id="btnReset">Nueva Nota</button>
        </div>
      </div>

      <div id="statusMsg" class="status-msg"></div>
    </section>

    <section class="preview-wrapper">
      <div class="preview-label">Vista Previa Exacta (Listo para WhatsApp / Impresión)</div>

      <div id="nota-canvas">
        <div id="prevFecha" class="overlay-field field-fecha"></div>
        <div id="prevNota" class="overlay-field field-nota">000065</div>
        <div id="prevCliente" class="overlay-field field-cliente"></div>
        <div id="prevTelefono" class="overlay-field field-telefono"></div>

        <div id="prevRowsContainer" class="overlay-rows"></div>

        <div id="prevSubtotal" class="overlay-total total-subtotal">$ 0.00</div>
        <div id="prevDescuento" class="overlay-total total-descuento">$ 0.00</div>
        <div id="prevEnvio" class="overlay-total total-envio">$ 0.00</div>
        <div id="prevTotal" class="overlay-total total-grand">$ 0.00</div>

        <img id="prevFirmaImg" class="overlay-firma" alt="Firma Autorizada" />
      </div>
    </section>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
